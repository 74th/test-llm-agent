<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#263238"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/></marker>
    <style>
      .title { font: 700 43px Arial, 'Noto Sans JP', sans-serif; fill: #111; }
      .subtitle { font: 400 23px Arial, 'Noto Sans JP', sans-serif; fill: #424242; }
      .zone { font: 700 26px Arial, 'Noto Sans JP', sans-serif; fill: #263238; }
      .head { font: 700 25px Arial, 'Noto Sans JP', sans-serif; fill: #111; }
      .body { font: 400 21px Arial, 'Noto Sans JP', sans-serif; fill: #202124; }
      .small { font: 400 18px Arial, 'Noto Sans JP', sans-serif; fill: #37474f; }
      .label { font: 600 19px Arial, 'Noto Sans JP', sans-serif; fill: #263238; }
      .mono { font: 600 18px 'Courier New', monospace; fill: #263238; }
    </style>
  </defs>

  <rect width="1800" height="1240" fill="#fff"/>
  <text x="55" y="78" class="title">■ OpenAI Agents API self-hosted 環境の構成</text>
  <text x="55" y="115" class="subtitle">セッション状態は OpenAI、コンテナのライフサイクルと対応付けは利用者側で管理する</text>

  <!-- User -->
  <rect x="92" y="190" width="275" height="130" rx="12" fill="#fff8e1" stroke="#c89d32" stroke-width="2"/>
  <text x="229" y="243" text-anchor="middle" class="head">利用者 / UI</text>
  <text x="229" y="283" text-anchor="middle" class="body">入力・会話の表示</text>

  <!-- Controller zone -->
  <rect x="480" y="155" width="570" height="940" rx="6" fill="#f6f9fc" stroke="#455a64" stroke-width="2"/>
  <text x="510" y="198" class="zone">利用者側: 常駐コントローラ / アプリ</text>
  <rect x="520" y="235" width="490" height="175" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="765" y="282" text-anchor="middle" class="head">アプリケーション</text>
  <text x="550" y="322" class="body">• セッション作成・入力送信・items 取得</text>
  <text x="550" y="357" class="body">• 同一 session_id の要求をロック</text>
  <text x="550" y="392" class="body">• アプリ用 OPENAI_API_KEY を使用</text>

  <rect x="520" y="505" width="490" height="175" rx="10" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="765" y="552" text-anchor="middle" class="head">ローカル Session Store</text>
  <text x="550" y="592" class="body">state/sessions.json</text>
  <text x="550" y="627" class="small">session_id → environment_id, remote_url</text>
  <text x="550" y="657" class="small">コンテナ ID、起動状態も記録</text>

  <rect x="520" y="770" width="490" height="250" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="765" y="817" text-anchor="middle" class="head">Docker Executor Manager</text>
  <text x="550" y="857" class="body">• コンテナを session_id 単位で起動・停止</text>
  <text x="550" y="892" class="body">• Docker labels で対応付け</text>
  <text x="550" y="927" class="body">• 例: 15 分無入力なら停止する</text>
  <text x="550" y="962" class="small">• lifecycle JSONL を記録</text>
  <text x="550" y="995" class="small">• executor 用キーだけをコンテナに渡す</text>

  <!-- OpenAI zone -->
  <rect x="1160" y="155" width="570" height="500" rx="6" fill="#f5f8ff" stroke="#4f6ea9" stroke-width="2"/>
  <text x="1190" y="198" class="zone">OpenAI Agents API</text>
  <rect x="1200" y="240" width="490" height="350" rx="10" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="2"/>
  <text x="1445" y="287" text-anchor="middle" class="head">Session と self_hosted Environment</text>
  <text x="1230" y="330" class="body">セッション作成時に返る値</text>
  <text x="1230" y="372" class="mono">session_id</text><text x="1405" y="372" class="body">会話を識別する ID</text>
  <text x="1230" y="414" class="mono">environment_id</text><text x="1460" y="414" class="body">実行環境を識別する ID</text>
  <text x="1230" y="456" class="mono">remote_url</text><text x="1415" y="456" class="body">executor の接続先 URL</text>
  <text x="1230" y="515" class="small">会話の履歴・turn・tool items を管理</text>
  <text x="1230" y="550" class="small">コンテナ自体の起動・終了は管理しない</text>

  <!-- Local Docker zone -->
  <rect x="1160" y="735" width="570" height="360" rx="6" fill="#f8faf8" stroke="#455a64" stroke-width="2"/>
  <text x="1190" y="778" class="zone">利用者側: Docker ホスト</text>
  <rect x="1200" y="820" width="490" height="215" rx="10" fill="#fff8e1" stroke="#c89d32" stroke-width="2"/>
  <text x="1445" y="868" text-anchor="middle" class="head">セッション用 executor コンテナ</text>
  <text x="1230" y="910" class="mono">codex exec-server</text>
  <text x="1230" y="947" class="small">--remote &lt;remote_url&gt;</text>
  <text x="1230" y="979" class="small">--environment-id &lt;environment_id&gt;</text>
  <text x="1230" y="1015" class="small">CODEX_API_KEY は executor 用の制限キー</text>

  <!-- arrows -->
  <path d="M367 255 H520" stroke="#263238" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="393" y="239" class="label">入力</text>

  <path d="M1010 295 H1200" stroke="#1565c0" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="1043" y="274" class="label">Sessions API</text>
  <text x="1030" y="323" class="small">create / retrieve / input / items</text>

  <path d="M765 410 V505" stroke="#263238" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="782" y="468" class="small">対応情報を保存</text>
  <path d="M765 680 V770" stroke="#263238" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="782" y="736" class="small">対応情報を読取</text>

  <path d="M1010 895 H1200" stroke="#263238" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="1045" y="872" class="label">docker run / stop</text>
  <text x="1037" y="921" class="small">labels: session-id, environment-id</text>

  <path d="M1445 820 V590" stroke="#1565c0" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="1470" y="705" class="label">executor 接続</text>
  <text x="1470" y="734" class="small">remote_url + environment_id</text>

  <!-- footer notes -->
  <rect x="92" y="1135" width="1638" height="68" rx="8" fill="#f1f3f4"/>
  <text x="122" y="1177" class="body">同じ session_id は、稼働中なら同じコンテナへルーティングする。停止後も session_id の会話は継続できるが、新コンテナのファイル状態を残すには別途永続化が必要。</text>
</svg>

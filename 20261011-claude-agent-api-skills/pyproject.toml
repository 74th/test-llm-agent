[project]
name = "verify-skills-in-sandbox"
version = "0.1.0"
description = "Agent SDK / Managed Agents で、スキルのファイルがサンドボックスのどこで読まれ・実行されるかの検証"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.13.0",
    "anyio>=4.15.1",
    "claude-agent-sdk>=0.2.165",
    "grpcio>=1.84.0",
    "grpcio-tools>=1.84.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "typesafe-sdk>=0.7.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: Anthropic API / Jev / Docker を実際に呼ぶテスト"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verify"]

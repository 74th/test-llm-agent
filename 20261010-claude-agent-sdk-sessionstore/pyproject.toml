[project]
name = "20261010-claude-agent-sdk-sessionstore"
version = "0.1.0"
description = "Claude Agent SDK の SessionStore とバックグラウンドタスクの検証"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.15.1",
    "claude-agent-sdk>=0.2.165",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "typesafe-sdk>=0.7.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not slow\""
pythonpath = ["src"]
markers = ["slow: 5分待機など時間のかかる手動検証"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verify"]
